services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: subledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d subledger"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    environment:
      DB_NAME: subledger
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: local-dev-key-change-before-deploy
      DEBUG: "1"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
